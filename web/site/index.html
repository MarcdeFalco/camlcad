<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camlcad</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "codemirror": "https://esm.sh/codemirror@6.0.1",
  "@codemirror/": "https://esm.sh/@codemirror/"
} }
</script>
</head>
<body>
<header>
  <strong>camlcad</strong>
  <select id="example"></select>
  <span id="status">chargement du toplevel…</span>
  <span class="spacer"></span>
  <button id="export-stl" disabled>STL</button>
  <button id="export-3mf" disabled>3MF</button>
</header>
<main>
  <section id="code"></section>
  <section id="view">
    <div id="notice" hidden></div>
    <nav id="timeline" hidden aria-label="Frise des features"></nav>
  </section>
  <aside>
    <h2>Esquisse</h2>
    <div id="sketch-start">
      <button data-plane="XY">Plan XY</button> <button data-plane="ZX">Plan XZ</button> <button data-plane="YZ">Plan YZ</button>
      <button id="sketch-on-face" disabled title="Cliquez d'abord une face plane de la pièce">Sur la face</button>
      <div id="face-info" class="hint"></div>
    </div>
    <div id="sketch-panel" hidden>
      <div class="tools"><button data-tool="poly">Contour</button> <button data-tool="circle">Cercle</button> <button data-tool="select">Sélection</button></div>
      <div id="sketch-status" class="hint"></div>
      <div id="sketch-constraints" class="tools"></div>
      <ol id="sketch-list"></ol>
      <div class="tools"><button id="sketch-ok-add">Extruder (+)</button> <button id="sketch-ok-cut">Enlever (−)</button> <button id="sketch-cancel">Annuler</button></div>
    </div>
    <div id="feature-panel" hidden></div>
    <h2>Paramètres</h2>
    <div id="params"></div>
    <div id="motion" hidden>
      <h2>Mouvement <button id="animate">▶</button></h2>
      <div id="coords"></div>
      <div id="inter"></div>
    </div>
    <h2>Features <span class="hint">clic droit : actions</span></h2>
    <ol id="tree"></ol>
    <pre id="error" hidden></pre>
  </aside>
</main>
<div id="ctxmenu" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
